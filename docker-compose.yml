version: '3.8'

services:
  scraper:
    build: ./services/scraper
    env_file:
      - .env
    volumes:
      - ./shared/data:/app/shared/data
    restart: "no"

  engine:
    build: ./services/engine
    volumes:
      - ./shared/data:/app/shared/data
    restart: "no"

  api:
    build: ./services/api
    ports:
      - "8880:8880"
    volumes:
      - ./shared/data:/app/shared/data
    restart: always

  frontend:
    image: nginx:alpine
    ports:
      - "3330:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: always
