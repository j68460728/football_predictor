<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Predictor — Premium Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0c10;
            --bg-card: #161b22;
            --bg-sidebar: #0d1117;
            --accent: #2f81f7;
            --accent-glow: rgba(47, 129, 247, 0.3);
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --text-bright: #ffffff;
            --border: #30363d;
            --success: #238636;
            --error: #da3633;
            --warn: #d29922;
            --amber: #ffab70;
            --amber-dim: rgba(255, 171, 112, 0.1);
            --sidebar-width: 280px;
            --radius: 12px;
            --glass: rgba(22, 27, 34, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        aside {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            height: 100vh;
            position: fixed;
            left: 0; top: 0;
            display: flex; flex-direction: column;
            padding: 1.5rem; z-index: 100;
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2.5rem; padding: 0.5rem; }
        .logo-icon { font-size: 1.5rem; background: linear-gradient(135deg, var(--accent), #79c0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-text { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.25rem; color: var(--text-bright); letter-spacing: -0.5px; }
        .logo-text span { color: var(--accent); }

        .sidebar-section { margin-bottom: 2rem; }
        .section-label { font-size: 0.7rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem; display: block; }

        .filter-group { margin-bottom: 1.25rem; }
        .filter-group label { display: block; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-main); }

        select { width: 100%; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.75rem; color: var(--text-bright); font-size: 0.9rem; outline: none; }

        .checkbox-group { display: flex; align-items: center; gap: 0.6rem; cursor: pointer; font-size: 0.9rem; }
        .checkbox-group input { width: 16px; height: 16px; accent-color: var(--accent); }

        .btn-apply {
            background: var(--accent); color: white; border: none; border-radius: 8px; padding: 0.85rem; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1rem;
        }
        .btn-apply:hover { filter: brightness(1.1); box-shadow: 0 4px 12px var(--accent-glow); }

        /* Main Area */
        main { margin-left: var(--sidebar-width); flex: 1; padding: 2rem; max-width: 1400px; }

        header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; }
        .header-left h1 { font-family: 'Outfit', sans-serif; font-size: 1.75rem; font-weight: 700; color: var(--text-bright); margin-bottom: 0.5rem; }
        .header-left p { color: var(--text-dim); font-size: 0.95rem; }

        .tabs { display: flex; gap: 2rem; margin-bottom: 2.5rem; border-bottom: 1px solid var(--border); }
        .tab { padding: 1rem 0.5rem; color: var(--text-dim); cursor: pointer; font-weight: 600; position: relative; transition: 0.2s; }
        .tab.active { color: var(--accent); }
        .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: var(--accent); }

        .status-pill { background: var(--bg-card); padding: 0.5rem 1rem; border-radius: 20px; border: 1px solid var(--border); display: flex; align-items: center; gap: 0.6rem; font-size: 0.85rem; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }
        .dot.pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }

        /* League Groups */
        .league-group { margin-bottom: 3rem; animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .league-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
        .league-name { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 1.1rem; color: var(--text-bright); }
        .match-count-badge { background: var(--border); color: var(--text-dim); font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 10px; font-weight: 700; }

        /* Grid */
        .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 1.5rem; }

        /* Match Card - Original Style */
        .match-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 1.25rem; position: relative; transition: all 0.2s; overflow: hidden;
        }
        .match-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .match-card.goliath { border-left: 4px solid var(--amber); }
        .match-card.goliath::after {
            content: 'GOLIATH VS DAVID'; position: absolute; top: 0.75rem; right: 0.75rem;
            font-size: 0.6rem; font-weight: 800; color: var(--amber); background: var(--amber-dim);
            padding: 0.2rem 0.5rem; border-radius: 4px; letter-spacing: 0.5px;
        }

        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
        .matchday { font-size: 0.75rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; }
        .match-type { font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; background: rgba(255,255,255,0.05); }

        .teams-container { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
        .team-row { display: flex; justify-content: space-between; align-items: center; }
        .team-name { font-weight: 600; font-size: 1.05rem; color: var(--text-bright); display: flex; align-items: center; gap: 0.5rem; }
        .goliath-tag { font-size: 0.65rem; font-weight: 800; color: var(--bg-deep); background: var(--amber); padding: 0.1rem 0.4rem; border-radius: 3px; }
        .rank-pill { font-size: 0.8rem; color: var(--text-dim); }

        .stats-box { background: rgba(0,0,0,0.2); border-radius: 8px; padding: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .stat-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .stat-title { font-size: 0.7rem; color: var(--text-dim); font-weight: 700; text-transform: uppercase; }
        .stat-line { display: flex; justify-content: space-between; font-size: 0.85rem; }
        .stat-val { font-weight: 600; color: var(--text-bright); }

        /* Corners - Intelligence Style */
        .pace-bar-bg { height: 6px; background: var(--border); border-radius: 3px; margin-top: 0.5rem; overflow: hidden; }
        .pace-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
        .early-game-box { background: var(--amber-dim); border: 1px solid rgba(255, 171, 112, 0.2); border-radius: 8px; padding: 0.75rem; margin-top: 1rem; }
        .inferred-tag { font-size: 0.6rem; background: var(--amber); color: var(--bg-deep); padding: 0.1rem 0.3rem; border-radius: 3px; font-weight: 800; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; color: var(--text-dim); }

        .status-msg { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--bg-card); border: 1px solid var(--border); padding: 1rem 1.5rem; border-radius: var(--radius); z-index: 1000; display: flex; align-items: center; gap: 1rem; }

        @media (max-width: 1000px) { aside { transform: translateX(-100%); } main { margin-left: 0; } }
    </style>
</head>
<body>

    <aside>
        <div class="logo">
            <div class="logo-icon">⚽</div>
            <div class="logo-text">Football <span>Predictor</span></div>
        </div>

        <div class="sidebar-section">
            <span class="section-label">Competition</span>
            <div class="filter-group">
                <label>Type</label>
                <select id="type-filter" onchange="updateCompetitionDropdown()">
                    <option value="">All Types</option>
                    <option value="LEAGUE">Leagues</option>
                    <option value="CUP">Cups</option>
                </select>
            </div>
            <div class="filter-group">
                <label>League</label>
                <select id="league-filter">
                    <option value="">All Leagues</option>
                </select>
            </div>
        </div>

        <div class="sidebar-section">
            <span class="section-label">Schedule</span>
            <select id="date-filter">
                <option value="">Full Week</option>
            </select>
        </div>

        <div class="sidebar-section">
            <span class="section-label">Analysis Filters</span>
            <div class="filter-group">
                <label class="checkbox-group">
                    <input type="checkbox" id="goliath-filter">
                    <span>Goliath vs David only</span>
                </label>
            </div>
            <div class="filter-group">
                <label>Goliath location</label>
                <select id="location-filter">
                    <option value="">Any</option>
                    <option value="true">Goliath at Home</option>
                    <option value="false">Goliath Away</option>
                </select>
            </div>
        </div>

        <button class="btn-apply" onclick="fetchData()" id="btn-apply">
            <span>Apply Analysis</span>
        </button>
    </aside>

    <main>
        <header>
            <div class="header-left">
                <h1>Analysis Hub</h1>
                <p id="status-text">Today's Forecast</p>
            </div>
            <div class="status-pill">
                <div class="dot pulse" id="status-dot"></div>
                <span id="conn-text">Connected</span>
            </div>
        </header>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('matches')" id="tab-matches">Match Forecast</div>
            <div class="tab" onclick="switchTab('corners')" id="tab-corners">Corners Intelligence</div>
        </div>

        <div id="content-area"></div>
    </main>

    <div id="notification-area"></div>

    <script>
        const API_URL = `${window.location.protocol}//${window.location.hostname}:8880`;
        let currentTab = 'matches';
        let allLeagues = [];

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            fetchData();
        }

        async function fetchData() {
            const btn = document.getElementById('btn-apply');
            const type = document.getElementById('type-filter').value;
            const league = document.getElementById('league-filter').value;
            const date = document.getElementById('date-filter').value;
            const goliath = document.getElementById('goliath-filter').checked;
            const location = document.getElementById('location-filter').value;

            btn.disabled = true;
            let url = `${API_URL}/${currentTab}?`;
            if (type) url += `type=${type}&`;
            if (league) url += `competition=${encodeURIComponent(league)}&`;
            if (date) url += `date=${date}&`;
            if (currentTab === 'matches') {
                if (goliath) url += `goliath=true&`;
                if (location === "true") url += `goliath_home=true&`;
                if (location === "false") url += `goliath_away=true&`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if (currentTab === 'matches') renderGroupedMatches(data);
                else renderGroupedCorners(data);
                
                // Update leagues for dropdown if not filtered
                if (!type && !league) {
                   const comps = [...new Set(data.map(m => m.league_name))].sort();
                   const select = document.getElementById('league-filter');
                   const current = select.value;
                   select.innerHTML = '<option value="">All Leagues</option>';
                   comps.forEach(c => {
                       const opt = document.createElement('option');
                       opt.value = c; opt.textContent = c;
                       if (c === current) opt.selected = true;
                       select.appendChild(opt);
                   });
                }
            } catch (e) { console.error(e); }
            finally { btn.disabled = false; }
        }

        function renderGroupedMatches(matches) {
            const container = document.getElementById('content-area');
            const groups = {};
            matches.forEach(m => {
                if (!groups[m.league_name]) groups[m.league_name] = [];
                groups[m.league_name].push(m);
            });

            container.innerHTML = Object.keys(groups).sort().map(name => `
                <div class="league-group">
                    <div class="league-header">
                        <span class="league-name">${name}</span>
                        <span class="match-count-badge">${groups[name].length}</span>
                    </div>
                    <div class="matches-grid">
                        ${groups[name].map(m => renderMatchCard(m)).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderMatchCard(m) {
            return `
                <div class="match-card ${m.is_goliath_vs_david ? 'goliath' : ''}">
                    <div class="card-top">
                        <span class="matchday">Matchday ${m.matchday || '—'}</span>
                        <span class="match-type ${m.competition_type === 'CUP' ? 'cup' : ''}">${m.competition_type || 'LEAGUE'} • ${m.status}</span>
                    </div>
                    <div class="teams-container">
                        <div class="team-row">
                            <span class="team-name">${m.home_team}${m.goliath_team === 'home' ? '<span class="goliath-tag">GOLIATH</span>' : ''}</span>
                            <span class="rank-pill">Rank <strong>#${m.rank_home ?? '—'}</strong></span>
                        </div>
                        <div class="team-row">
                            <span class="team-name">${m.away_team}${m.goliath_team === 'away' ? '<span class="goliath-tag">GOLIATH</span>' : ''}</span>
                            <span class="rank-pill">Rank <strong>#${m.rank_away ?? '—'}</strong></span>
                        </div>
                    </div>
                    <div class="stats-box">
                        <div class="stat-group">
                            <span class="stat-title">Home Average</span>
                            <div class="stat-line"><span>For</span><span class="stat-val">${(m.home_avg_goals_for ?? 0).toFixed(2)}</span></div>
                            <div class="stat-line"><span>Ag.</span><span class="stat-val">${(m.home_avg_goals_against ?? 0).toFixed(2)}</span></div>
                        </div>
                        <div class="stat-group">
                            <span class="stat-title">Away Average</span>
                            <div class="stat-line"><span>For</span><span class="stat-val">${(m.away_avg_goals_for ?? 0).toFixed(2)}</span></div>
                            <div class="stat-line"><span>Ag.</span><span class="stat-val">${(m.away_avg_goals_against ?? 0).toFixed(2)}</span></div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span>🕐 ${new Date(m.date).toLocaleString()}</span>
                        <span style="color:var(--accent); font-weight:700">ID: ${m.fixture_id}</span>
                    </div>
                </div>
            `;
        }

        function renderGroupedCorners(corners) {
            const container = document.getElementById('content-area');
            const groups = {};
            corners.forEach(c => {
                if (!groups[c.league_name]) groups[c.league_name] = [];
                groups[c.league_name].push(c);
            });

            container.innerHTML = Object.keys(groups).sort().map(name => `
                <div class="league-group">
                    <div class="league-header">
                        <span class="league-name">${name}</span>
                        <span class="match-count-badge">${groups[name].length}</span>
                    </div>
                    <div class="matches-grid">
                        ${groups[name].map(c => renderCornerCard(c)).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderCornerCard(c) {
            const p = c.prediction;
            const signal = p.pace.classification === 'HIGH' ? 'HIGH TEMPO' : (p.expected_total_corners > 10.5 ? 'HIGH EXPECTATION' : 'BALANCED');
            const signalColor = p.pace.classification === 'HIGH' ? 'var(--accent)' : (p.expected_total_corners > 10.5 ? 'var(--success)' : 'var(--border)');
            
            return `
                <div class="match-card">
                    <div class="card-top">
                        <span class="matchday">Expected Total: <strong>${p.expected_total_corners}</strong></span>
                        <span class="match-type" style="background:${signalColor}; color:white; padding: 0.2rem 0.6rem">${signal}</span>
                    </div>
                    
                    <div class="teams-container">
                        <div class="team-row">
                            <span class="team-name">${c.home_team}</span>
                            <span class="rank-pill">L5 Form: <strong>${p.form.home_last5}</strong></span>
                        </div>
                        <div class="team-row">
                            <span class="team-name">${c.away_team}</span>
                            <span class="rank-pill">L5 Form: <strong>${p.form.away_last5}</strong></span>
                        </div>
                    </div>

                    <div class="stats-box">
                        <div class="stat-group">
                            <span class="stat-title">Market Probabilities</span>
                            <div class="stat-line"><span>Over 8.5</span><span class="stat-val">${(p.probabilities.over_8_5*100).toFixed(0)}%</span></div>
                            <div class="stat-line"><span>Over 9.5</span><span class="stat-val">${(p.probabilities.over_9_5*100).toFixed(0)}%</span></div>
                            <div class="stat-line"><span>Over 10.5</span><span class="stat-val">${(p.probabilities.over_10_5*100).toFixed(0)}%</span></div>
                        </div>
                        <div class="stat-group">
                            <span class="stat-title">Match Pace Index</span>
                            <div class="pace-bar-bg"><div class="pace-bar-fill" style="width:${p.pace.pace_score*100}%"></div></div>
                            <div class="stat-line"><span style="font-size:0.6rem; font-weight:800">${p.pace.classification} TEMPO</span></div>
                            <div class="stat-line" style="margin-top:0.5rem"><span>1H Exp:</span><span class="stat-val">${p.expected_first_half_corners}</span></div>
                        </div>
                    </div>

                    <div class="early-game-box">
                        <div class="stat-line" style="font-size:0.7rem; font-weight:800; color:var(--amber); margin-bottom:0.5rem">
                            EARLY MARKETS <span class="inferred-tag">INFERRED</span>
                        </div>
                        <div class="sub-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem">
                            <div class="stat-group">
                                <span class="stat-title" style="font-size:0.6rem">0-10m Prob</span>
                                <span class="stat-val" style="color:var(--amber)">${(p.early_markets.p_0_10*100).toFixed(0)}%</span>
                            </div>
                            <div class="stat-group">
                                <span class="stat-title" style="font-size:0.6rem">0-20m Prob</span>
                                <span class="stat-val" style="color:var(--amber)">${(p.early_markets.p_0_20*100).toFixed(0)}%</span>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer">
                        <span>Context: <strong>${p.context.classification}</strong></span>
                        <span style="color:var(--accent); font-weight:700">Mismatch: ${p.context.mismatch_score}</span>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('date-filter');
            const now = new Date();
            for(let i=0; i<7; i++) {
                const d = new Date(now); d.setDate(now.getDate()+i);
                const iso = d.toISOString().split('T')[0];
                const opt = document.createElement('option'); opt.value = iso; opt.textContent = iso; select.appendChild(opt);
            }
            fetchData();
        });
    </script>
</body>
</html>
